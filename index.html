<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHANTOM RATING</title>
<style>
:root{--red:#e60012;--ink:#050505;--panel:#1a1a1a;--c:#e60012;--w:#fff;--f:Impact,"Arial Black","Haettenschweiler",sans-serif}
*{box-sizing:border-box;margin:0}
html,body{background:#000;color:var(--w);font-family:"Trebuchet MS",Verdana,sans-serif;min-height:100%}
body{background:radial-gradient(circle at 80% 0,#3a0008,#000 60%) fixed}
body::before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(230,0,18,.12) 60px 64px);pointer-events:none}
#app{position:relative;max-width:900px;margin:0 auto;padding:18px 16px 60px;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(-30px) skewX(-6deg)}to{opacity:1;transform:none}}
h1,h2,h3,.big,button,.tag{font-family:var(--f);letter-spacing:.02em;text-transform:uppercase}
.logo{font-size:clamp(46px,14vw,110px);line-height:.9;transform:skewX(-8deg) rotate(-3deg);margin:20px 0 26px;text-shadow:5px 5px 0 var(--red)}
.logo span{background:var(--red);padding:0 10px;display:inline-block;transform:skewX(-4deg)}
button,.btn{font-size:20px;border:3px solid #fff;background:#000;color:#fff;padding:14px 22px;min-height:48px;cursor:pointer;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%);transition:.15s;margin:5px 4px}
button:hover,button:focus-visible{background:var(--red);transform:translateX(6px) skewX(-6deg);outline:none}
button.p{background:var(--red)}button.p:hover{background:#fff;color:#000}
button.sm{font-size:15px;padding:8px 14px;min-height:40px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.panel{background:var(--panel);border-left:8px solid var(--red);padding:16px;margin:14px 0;transform:skewX(-2deg)}
.panel>*{transform:skewX(2deg)}
input,select,textarea{width:100%;background:#000;color:#fff;border:2px solid #555;padding:12px;font-size:16px;margin:6px 0;font-family:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{min-height:120px}
label{font-size:14px;color:#ccc}
.cov{width:130px;height:130px;object-fit:cover;background:var(--red);border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-size:50px;flex:none}
.card{display:flex;gap:14px;align-items:center;background:var(--panel);border-left:8px solid var(--c);padding:10px;margin:10px 0;cursor:pointer;transition:.15s}
.card:hover,.card:focus-visible{transform:translateX(8px);background:#262626;outline:none}
.card .cov{width:72px;height:72px;font-size:28px}
.card .n{font-family:var(--f);font-size:34px;color:var(--c);margin-left:auto;white-space:nowrap}
.card small{color:#bbb;display:block}
.tag{display:inline-block;background:var(--c);color:#000;padding:2px 10px;transform:skewX(-10deg);font-size:14px}
.big{font-size:clamp(90px,30vw,190px);line-height:1;color:var(--c);text-shadow:4px 4px 0 #000,7px 7px 0 rgba(255,255,255,.15);transition:color .2s}
.hero{text-align:center;padding:10px;border-top:6px solid var(--c);border-bottom:6px solid var(--c);margin:14px 0;background:linear-gradient(100deg,#000 55%,color-mix(in srgb,var(--c) 25%,#000))}
.a-low{animation:low .45s}.a-mid{animation:mid .5s}.a-high{animation:high .7s}.a-ten{animation:ten 1.2s}
@keyframes low{0%{transform:translateX(-30px) scale(1.3)}25%{transform:translateX(25px)}50%{transform:translateX(-18px)}75%{transform:translateX(10px)}100%{transform:none}}
@keyframes mid{from{transform:scale(.6);opacity:.3}to{transform:none;opacity:1}}
@keyframes high{0%{transform:scale(.7);filter:brightness(3) drop-shadow(0 0 0 var(--c))}100%{transform:none;filter:drop-shadow(0 0 22px var(--c))}}
@keyframes ten{0%{transform:rotate(-180deg) scale(.1)}60%{transform:rotate(8deg) scale(1.3);filter:drop-shadow(0 0 40px gold)}100%{transform:none;filter:drop-shadow(0 0 28px gold)}}
input[type=range]{padding:0;height:46px;accent-color:var(--c);border:0;background:none}
.bar{height:16px;background:#333;transform:skewX(-20deg);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--red);transition:width .6s}
.msg{padding:12px;margin:10px 0;border:2px solid;font-weight:bold}
.err{border-color:#ff4d4d;background:#3a0000}.ok{border-color:#1fbf4f;background:#022a10}.inf{border-color:#888;background:#222}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat div{background:var(--panel);padding:12px;border-top:4px solid var(--red)}
.stat b{font-family:var(--f);font-size:28px;display:block}
.dist{display:flex;align-items:flex-end;gap:4px;height:100px}
.dist i{flex:1;background:var(--red);min-height:2px}
canvas{max-width:100%;height:auto;background:#000;border:3px solid #fff;display:block;margin:10px auto;width:270px;aspect-ratio:9/16}
.flash{position:fixed;inset:0;background:var(--red);animation:fl .5s forwards;pointer-events:none;z-index:9}
@keyframes fl{from{opacity:.9;clip-path:polygon(0 0,0 0,0 100%,0 100%)}50%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}to{opacity:0}}
body.calm *{animation-duration:.01s!important;transition:none!important}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ 1. DATOS ============ */
const KEY="phantom_rating_v1";
const CATS=[[2,"Desastre","#7a0010"],[4,"Muy mala","#e60012"],[5,"Mala","#ff4d1a"],[6,"Aprobada por los pelos","#ff9a1f"],[7,"Decente","#ffd400"],[8,"Buena","#a6e22e"],[9,"Muy buena","#1fbf4f"],[9.5,"Excelente","#1e6bff"],[10,"Extraordinaria","#a43bff"]];
const cat=n=>n>=10?["Obra maestra","#ffc83d"]:(CATS.find(c=>n<c[0])||CATS[8]).slice(1);
const fmt=n=>n==null?"—":(Math.round(n*10)/10).toFixed(1).replace(".",",");
let D=load();
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.items))return d}catch(e){}return{items:[],settings:{name:"PHANTOM RATING",calm:false,tpl:0}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){msg("No se pudo guardar: el almacenamiento del navegador está lleno o bloqueado.","err")}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function eff(it){if(it.type==="song"||it.manual)return it.rating;const r=(it.tracks||[]).filter(t=>t.r!=null);return r.length?r.reduce((a,t)=>a+t.r,0)/r.length:null}
const isRated=it=>eff(it)!=null;
function setCol(n){const c=n==null?"#e60012":cat(n)[1];document.documentElement.style.setProperty("--c",c)}
const cover=(u,cls="cov")=>u?`<img class="${cls}" src="${esc(u)}" alt="" crossorigin="anonymous" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'${cls}',textContent:'♪'}))">`:`<div class="${cls}">♪</div>`;
function msg(t,k="inf"){const m=$("#msgs");if(m)m.innerHTML=`<div class="msg ${k}" role="status">${esc(t)}</div>`}
/* ============ 2. NAVEGACIÓN ============ */
let V={name:"home"};
function go(name,arg){V={name,...arg};document.body.classList.toggle("calm",!!D.settings.calm);window.scrollTo(0,0);const f=VIEWS[name];$("#app").innerHTML=f(V);setCol(V.col);if(typeof AFTER[name]==="function")AFTER[name](V)}
const head=(t,back)=>`<div class="row">${back?`<button class="sm" data-a="go" data-v="${back}">← Volver</button>`:""}<h2 style="font-size:30px">${t}</h2></div><div id="msgs" aria-live="polite"></div>`;
const find=id=>D.items.find(i=>i.id===id);
/* ============ 3. VISTAS ============ */
const VIEWS={
home(){const l=[...D.items].sort((a,b)=>b.modified-a.modified)[0];const n=l&&eff(l);
 const [cn,cc]=n!=null?cat(n):["",""];
 return `<h1 class="logo"><span>${esc(D.settings.name||"PHANTOM RATING")}</span></h1>
 <div class="row"><button class="p" data-a="go" data-v="add" data-t="song">Calificar canción</button><button class="p" data-a="go" data-v="add" data-t="album">Calificar álbum</button>
 <button data-a="go" data-v="coll">Mi colección</button><button data-a="go" data-v="settings">Ajustes</button></div>
 ${l?`<h3 style="margin-top:24px">Última reseña</h3><div class="card" tabindex="0" data-a="open" data-id="${l.id}" style="--c:${n!=null?cc:"#e60012"}">${cover(l.cover)}<div><b>${esc(l.title)}</b><small>${esc(l.artist)}</small>${n!=null?`<span class="tag">${cn}</span>`:""}</div><span class="n">${fmt(n)}</span></div>`
 :`<div class="panel"><h3>Aún no hay reseñas</h3><p>Pega un enlace de Spotify o escribe los datos a mano y pon tu primera nota.</p></div>`}`},
add(v){const t=v.t;return `${head(t==="song"?"Nueva canción":"Nuevo álbum","home")}
 <div class="panel"><label for="url">Enlace de Spotify (${t==="song"?"canción":"álbum"})</label>
 <input id="url" inputmode="url" placeholder="https://open.spotify.com/${t==="song"?"track":"album"}/..."><button class="p" data-a="analyze" data-t="${t}">Analizar enlace</button>
 <p><small>Sin conexión o sin enlace, rellena los datos a mano debajo.</small></p></div>
 <div class="panel" id="confirm"><h3>Datos a confirmar</h3>
 <label>Título</label><input id="f-title"><label>Artista</label><input id="f-artist"><label>Portada (URL de imagen, opcional)</label><input id="f-cover">
 <label>${t==="song"?"Duración (mm:ss, opcional)":"Fecha de publicación (opcional)"}</label><input id="f-extra">
 ${t==="album"?`<label>Canciones (una por línea)</label><textarea id="f-tracks" placeholder="Canción 1&#10;Canción 2"></textarea>`:""}
 <button class="p" data-a="create" data-t="${t}">Confirmar y empezar</button></div>`},
rate(v){const it=find(v.id);const tr=v.ti!=null?it.tracks[v.ti]:it;const r=v.ti!=null?tr.r:(it.type==="song"||it.manual?it.rating:eff(it)??null);
 const op=v.ti!=null?tr.o:it.opinion;const name=v.ti!=null?tr.t:it.title;
 return `${head(v.ti!=null?"Valorar canción":it.type==="song"?"Valorar canción":"Nota global del álbum","")}
 <div class="row">${cover(it.cover)}<div><h3>${esc(name)}</h3><p>${esc(it.artist)}</p>${it.dur&&v.ti==null?`<small>${esc(it.dur)}</small>`:""}</div></div>
 <div class="hero"><div class="big" id="num">${fmt(r)}</div><span class="tag" id="cat">${r==null?"Sin puntuar":cat(r)[0]}</span></div>
 <label for="sl">Nota (0 a 10, con decimales)</label><input type="range" id="sl" min="0" max="10" step="0.1" value="${r??5}" aria-label="Nota">
 <label for="nn">O escribe la nota exacta</label><input id="nn" type="text" inputmode="decimal" value="${r==null?"":fmt(r)}" placeholder="p. ej. 8,7">
 <label for="op">Tu opinión</label><textarea id="op" placeholder="Por qué te gusta o no te gusta...">${esc(op||"")}</textarea>
 <div class="row"><button class="p" data-a="saverate">Guardar valoración</button>${v.ti==null?`<button data-a="go" data-v="video" data-id="${it.id}">Generar vídeo</button>`:""}<button data-a="back">Cancelar</button></div>`},
album(v){const it=find(v.id);const n=eff(it);const rated=it.tracks.filter(t=>t.r!=null).length;const tot=it.tracks.length;
 let ord=it.tracks.map((t,i)=>({...t,i}));const s=v.sort||"orig";
 if(s==="desc")ord.sort((a,b)=>(b.r??-1)-(a.r??-1));if(s==="asc")ord.sort((a,b)=>(a.r??11)-(b.r??11));
 const rs=it.tracks.filter(t=>t.r!=null);const mx=Math.max(...rs.map(t=>t.r)),mn=Math.min(...rs.map(t=>t.r));
 return `${head(esc(it.title),"coll")}
 <div class="row">${cover(it.cover)}<div><p>${esc(it.artist)}</p><small>${tot} canciones${it.extra?" · "+esc(it.extra):""}</small></div></div>
 <div class="hero"><div class="big" id="num" style="font-size:clamp(70px,22vw,140px)">${fmt(n)}</div><span class="tag">${n==null?"Sin puntuar":cat(n)[0]}</span><p><small>Nota ${it.manual?"manual":"automática (media de canciones puntuadas)"}</small></p></div>
 <div class="row"><button class="p" data-a="rate" data-id="${it.id}">Nota manual</button>${it.manual?`<button data-a="auto" data-id="${it.id}">Volver a media automática</button>`:""}<button data-a="go" data-v="video" data-id="${it.id}">Vídeo del álbum</button></div>
 <p>${rated} de ${tot} canciones valoradas</p><div class="bar"><i style="width:${tot?rated/tot*100:0}%"></i></div>
 <label for="srt">Ordenar</label><select id="srt"><option value="orig"${s==="orig"?" selected":""}>Posición original</option><option value="desc"${s==="desc"?" selected":""}>Nota de mayor a menor</option><option value="asc"${s==="asc"?" selected":""}>Nota de menor a mayor</option></select>
 ${ord.map(t=>{const c=t.r!=null?cat(t.r)[1]:"#555";return `<div class="card" tabindex="0" style="--c:${c}" data-a="rate" data-id="${it.id}" data-ti="${t.i}"><div><b>${t.i+1}. ${esc(t.t)}</b>${t.r!=null&&rs.length>1&&t.r===mx?"<small>▲ Mejor</small>":""}${t.r!=null&&rs.length>1&&t.r===mn&&mn!==mx?"<small>▼ Peor</small>":""}</div><span class="n" style="${t.r==null?"font-size:16px;color:#888":""}">${t.r==null?"Sin puntuar":fmt(t.r)}</span></div>`}).join("")}
 <div class="panel"><h3>Reseña general</h3><textarea id="aop">${esc(it.opinion||"")}</textarea><button data-a="saveop" data-id="${it.id}">Guardar reseña</button></div>`},
coll(v){return `${head("Mi colección","home")}
 <div class="row"><button class="sm" data-a="go" data-v="stats">Estadísticas</button></div>
 <input id="q" placeholder="Buscar por título o artista" value="${esc(v.q||"")}">
 <div class="row"><select id="ft" style="flex:1"><option value="all">Todo</option><option value="song">Solo canciones</option><option value="album">Solo álbumes</option></select>
 <select id="so" style="flex:1"><option value="date">Más recientes</option><option value="desc">Mejores primero</option><option value="asc">Peores primero</option></select></div><div id="list"></div>`},
stats(){const ent=[];D.items.forEach(i=>{if(i.type==="song"&&i.rating!=null)ent.push({t:i.title,a:i.artist,r:i.rating});(i.tracks||[]).forEach(t=>{if(t.r!=null)ent.push({t:t.t,a:i.artist,r:t.r})})});
 const al=D.items.filter(i=>i.type==="album"&&isRated(i)).length;
 if(!ent.length&&!al)return `${head("Estadísticas","coll")}<div class="panel"><h3>Sin datos todavía</h3><p>Puntúa alguna canción y aquí verás tus números reales.</p></div>`;
 const sorted=[...ent].sort((a,b)=>b.r-a.r);const avg=ent.length?ent.reduce((a,e)=>a+e.r,0)/ent.length:null;
 const bins=Array(10).fill(0);ent.forEach(e=>bins[Math.min(9,Math.floor(e.r))]++);const mb=Math.max(...bins,1);
 const ar={};ent.forEach(e=>ar[e.a]=(ar[e.a]||0)+1);const top=Object.entries(ar).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `${head("Estadísticas","coll")}<div class="stat"><div><b>${ent.length}</b>canciones puntuadas</div><div><b>${al}</b>álbumes puntuados</div><div><b>${fmt(avg)}</b>nota media</div>
 <div><b>${sorted[0]?fmt(sorted[0].r):"—"}</b>mejor: ${esc(sorted[0]?.t||"—")}</div><div><b>${sorted.length?fmt(sorted.at(-1).r):"—"}</b>peor: ${esc(sorted.at(-1)?.t||"—")}</div></div>
 <div class="panel"><h3>Distribución (0–10)</h3><div class="dist">${bins.map((b,i)=>`<i style="height:${b/mb*100}%;background:${cat(i+.5)[1]}" title="${i}–${i+1}: ${b}"></i>`).join("")}</div></div>
 <div class="panel"><h3>Artistas más valorados</h3>${top.map(([a,n])=>`<p>${esc(a)} — ${n}</p>`).join("")}</div>`},
settings(){const s=D.settings;return `${head("Ajustes","home")}
 <div class="panel"><label>Nombre de la aplicación</label><input id="s-name" value="${esc(s.name)}" maxlength="24">
 <label><input type="checkbox" id="s-calm" style="width:auto"${s.calm?" checked":""}> Reducir animaciones</label>
 <label>Plantilla de vídeo por defecto</label><select id="s-tpl">${["Rojo explosivo","Negro y diagonales","Rojo sólido"].map((n,i)=>`<option value="${i}"${s.tpl==i?" selected":""}>${n}</option>`).join("")}</select>
 <button class="p" data-a="saveset">Guardar ajustes</button><button data-a="resetapp">Restablecer apariencia</button></div>
 <div class="panel"><h3>Tus datos</h3><div class="row"><button data-a="export">Exportar JSON</button><button data-a="import">Importar JSON</button></div>
 <input type="file" id="file" accept="application/json" hidden><button data-a="resetdata" style="border-color:#f55;color:#f88">Borrar todas las valoraciones</button>
 <p><small>Los datos se guardan solo en este navegador. Si borras los datos del navegador se pierden: exporta copias.</small></p></div>`},
video(v){const it=find(v.id);const o=v.ti!=null?it.tracks[v.ti].o:it.opinion;
 return `${head("Generar vídeo","home")}<canvas id="cv" width="1080" height="1920" aria-label="Vista previa del vídeo"></canvas>
 <div class="panel"><label>Opinión (tu texto original)</label><textarea id="v-op">${esc(o||"")}</textarea>
 <label>Duración aproximada</label><select id="v-dur"><option value="12">12 segundos</option><option value="18" selected>18 segundos</option><option value="25">25 segundos</option></select>
 <label>Plantilla</label><select id="v-tpl">${["Rojo explosivo","Negro y diagonales","Rojo sólido"].map((n,i)=>`<option value="${i}"${D.settings.tpl==i?" selected":""}>${n}</option>`).join("")}</select>
 ${it.type==="album"?`<label><input type="checkbox" id="v-ex" style="width:auto" checked> Mostrar mejor y peor canción</label>`:""}
 <div class="row"><button data-a="prev">Vista previa</button><button class="p" data-a="rec">Generar y descargar</button></div><div id="vst"></div></div>`}
};
/* ============ 4. DESPUÉS DE RENDER ============ */
const AFTER={
add(){},
rate(v){const it=find(v.id);const tr=v.ti!=null?it.tracks[v.ti]:it;let cur=v.ti!=null?tr.r:(it.type==="song"||it.manual?it.rating:eff(it)??null);v.cur=cur;setCol(cur);
 const upd=n=>{n=Math.min(10,Math.max(0,Math.round(n*10)/10));const was=cat(v.cur??-1)[0];v.cur=n;setCol(n);$("#num").textContent=fmt(n);$("#cat").textContent=cat(n)[0];
  const el=$("#num");el.className="big "+(n<5?"a-low":n<7?"a-mid":n<10?"a-high":"a-ten");void el.offsetWidth;if(n>=10&&was!=="Obra maestra")flash();};
 $("#sl").oninput=e=>{upd(+e.target.value);$("#nn").value=fmt(v.cur)};
 $("#nn").onchange=e=>{const n=parseFloat(e.target.value.replace(",","."));if(isNaN(n)||n<0||n>10){msg("Escribe un número entre 0 y 10.","err");return}$("#sl").value=n;upd(n)}},
coll(v){const draw=()=>{const q=$("#q").value.toLowerCase(),ft=$("#ft").value,so=$("#so").value;
 let l=D.items.filter(i=>(ft==="all"||i.type===ft)&&(i.title+" "+i.artist).toLowerCase().includes(q));
 if(so==="date")l.sort((a,b)=>b.modified-a.modified);else l.sort((a,b)=>so==="desc"?(eff(b)??-1)-(eff(a)??-1):(eff(a)??11)-(eff(b)??11));
 $("#list").innerHTML=l.length?l.map(i=>{const n=eff(i);const c=n!=null?cat(n):["Sin puntuar","#555"];return `<div class="card" tabindex="0" style="--c:${c[1]}" data-a="open" data-id="${i.id}">${cover(i.cover)}<div><b>${esc(i.title)}</b><small>${esc(i.artist)} · ${i.type==="song"?"Canción":"Álbum"}</small><small>${new Date(i.modified).toLocaleDateString("es")}</small><span class="tag">${c[0]}</span></div><span class="n">${fmt(n)}</span><button class="sm" data-a="del" data-id="${i.id}" aria-label="Eliminar">✕</button></div>`}).join(""):`<div class="panel"><h3>${D.items.length?"Sin resultados":"Tu colección está vacía"}</h3><p>${D.items.length?"Prueba con otros filtros.":"Valora tu primera canción o álbum y aparecerá aquí."}</p></div>`};
 ["#q","#ft","#so"].forEach(s=>$(s).oninput=draw);draw()},
album(v){setCol(null);$("#srt").onchange=e=>go("album",{id:v.id,sort:e.target.value})},
video(v){const it=find(v.id);V.vd=videoData(it,v.ti);drawPreview(0.9)}
};
function flash(){if(D.settings.calm)return;const f=document.createElement("div");f.className="flash";document.body.append(f);setTimeout(()=>f.remove(),600)}
/* ============ 5. ACCIONES ============ */
const A={
go(e){go(e.dataset.v,{t:e.dataset.t,id:e.dataset.id})},
back(){const it=find(V.id);if(V.ti!=null||it.type==="album")go("album",{id:V.id});else go("home")},
open(e){const it=find(e.dataset.id);go(it.type==="album"?"album":"rate",{id:it.id})},
rate(e){const it=find(e.dataset.id);go("rate",{id:it.id,ti:e.dataset.ti!=null?+e.dataset.ti:null})},
async analyze(e){const t=e.dataset.t,u=$("#url").value.trim();
 const m=u.match(/^https?:\/\/open\.spotify\.com\/(?:intl-[a-z]+\/)?(track|album)\/([A-Za-z0-9]{22})/);
 if(!m){msg("Ese enlace no es válido. Debe ser como open.spotify.com/"+(t==="song"?"track":"album")+"/…","err");return}
 if((m[1]==="track")!==(t==="song")){msg(`Ese enlace es de ${m[1]==="track"?"una canción":"un álbum"}. Vuelve atrás y elige la opción correcta.`,"err");return}
 if(!navigator.onLine){msg("Sin conexión: rellena los datos a mano.","err");return}
 msg("Analizando enlace…");try{const r=await fetch("https://open.spotify.com/oembed?url="+encodeURIComponent(u));if(!r.ok)throw 0;const d=await r.json();
  $("#f-title").value=d.title||"";$("#f-cover").value=d.thumbnail_url||"";$("#f-cover").dataset.url=u;
  msg("Título y portada obtenidos. Spotify no entrega el artista, la duración ni la lista de canciones sin una clave de API: complétalos a mano.","ok");$("#confirm").scrollIntoView({behavior:"smooth"})}
 catch(x){msg("No se pudo leer el enlace (sin conexión o bloqueado por el navegador). Rellena los datos a mano.","err")}},
create(e){const t=e.dataset.t,title=$("#f-title").value.trim(),artist=$("#f-artist").value.trim();
 if(!title||!artist){msg("Falta el título o el artista.","err");return}
 const now=Date.now(),x=$("#f-extra").value.trim();
 const it={id:uid(),type:t,title,artist,cover:$("#f-cover").value.trim(),url:$("#f-cover").dataset.url||"",rating:null,opinion:"",created:now,modified:now,manual:false};
 if(t==="song")it.dur=x;else{it.extra=x;it.tracks=$("#f-tracks").value.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>({t:s,r:null,o:""}));if(!it.tracks.length){msg("Escribe al menos una canción del álbum.","err");return}}
 D.items.push(it);save();go(t==="song"?"rate":"album",{id:it.id})},
saverate(){const it=find(V.id);const n=V.cur==null?null:V.cur;if(n==null){msg("Mueve el selector para elegir una nota.","err");return}
 const o=$("#op").value.trim();if(V.ti!=null){it.tracks[V.ti].r=n;it.tracks[V.ti].o=o}else{it.rating=n;it.opinion=o;if(it.type==="album")it.manual=true}
 it.modified=Date.now();save();flash();msg("¡Valoración guardada!","ok");
 setTimeout(()=>{it.type==="album"?go("album",{id:it.id}):go("home")},700)},
saveop(e){const it=find(e.dataset.id);it.opinion=$("#aop").value.trim();it.modified=Date.now();save();msg("Reseña guardada.","ok")},
auto(e){const it=find(e.dataset.id);it.manual=false;it.rating=null;it.modified=Date.now();save();go("album",{id:it.id})},
del(e,ev){ev.stopPropagation();const it=find(e.dataset.id);if(confirm(`¿Eliminar «${it.title}»? No se puede deshacer.`)){D.items=D.items.filter(i=>i!==it);save();go("coll")}},
saveset(){D.settings.name=$("#s-name").value.trim()||"PHANTOM RATING";D.settings.calm=$("#s-calm").checked;D.settings.tpl=+$("#s-tpl").value;save();document.body.classList.toggle("calm",D.settings.calm);msg("Ajustes guardados.","ok")},
resetapp(){D.settings={name:"PHANTOM RATING",calm:false,tpl:0};save();go("settings")},
resetdata(){if(confirm("Se borrarán TODAS tus valoraciones. ¿Continuar?")){D.items=[];save();msg("Valoraciones borradas.","ok")}},
export(){if(!D.items.length){msg("Aún no hay valoraciones que exportar.","err");return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="phantom_rating_"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
import(){const f=$("#file");f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d||!Array.isArray(d.items))throw 0;const ok=d.items.filter(i=>i&&typeof i.id==="string"&&typeof i.title==="string"&&typeof i.artist==="string"&&(i.type==="song"||i.type==="album")&&(i.rating==null||(typeof i.rating==="number"&&i.rating>=0&&i.rating<=10))&&(i.type==="song"||Array.isArray(i.tracks)));
  const ids=new Set(D.items.map(i=>i.id));const nw=ok.filter(i=>!ids.has(i.id)).map(i=>({...i,created:+i.created||Date.now(),modified:+i.modified||Date.now()}));
  D.items.push(...nw);save();msg(`Importadas ${nw.length} valoraciones nuevas. Se ignoraron ${d.items.length-nw.length} (inválidas o ya existentes); no se ha sobrescrito nada.`,"ok")}catch(x){msg("El archivo no es una copia válida de Phantom Rating.","err")}};r.readAsText(f.files[0])};f.click()},
prev(){drawPreview(null)},
rec(){record()}
};
document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(el&&A[el.dataset.a])A[el.dataset.a](el,e)});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("card")){e.preventDefault();e.target.click()}});
/* ============ 6. VÍDEO (Canvas + MediaRecorder) ============ */
function videoData(it,ti){const tr=ti!=null?it.tracks[ti]:null;const n=tr?tr.r:eff(it);const d={title:tr?tr.t:it.title,artist:it.artist,score:n??0,rated:n!=null,img:null,extra:[]};
 if(it.type==="album"&&!tr){const rs=it.tracks.filter(t=>t.r!=null).sort((a,b)=>b.r-a.r);if(rs.length>1){d.extra=[["▲ "+rs[0].t,rs[0].r],["▼ "+rs.at(-1).t,rs.at(-1).r]]}}
 if(it.cover){const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{d.img=im;d.ok=true};im.onerror=()=>{d.imgFail=true};im.src=it.cover}return d}
const cl=x=>Math.min(1,Math.max(0,x)),ez=x=>1-Math.pow(1-cl(x),3);
function wrap(c,t,x,y,w,lh,max){const ws=t.split(/\s+/);let l="",n=0;for(const w2 of ws){const s=l?l+" "+w2:w2;if(c.measureText(s).width>w&&l){c.fillText(l,x,y+n*lh);n++;l=w2;if(n>=max){return}}else l=s}if(l&&n<max)c.fillText(l,x,y+n*lh)}
function frame(c,d,t,T,tpl,op){const W=1080,H=1920,p=t/T;c.clearRect(0,0,W,H);c.fillStyle=tpl===2?"#e60012":"#080808";c.fillRect(0,0,W,H);
 const col=cat(d.score*ez((p-.4)/.2))[1];
 c.save();c.globalAlpha=tpl===2?.35:1;c.fillStyle=tpl===1?"#222":"#e60012";for(let i=-3;i<9;i++){const o=((t*120+i*300)%2700)-400;c.beginPath();c.moveTo(o,0);c.lineTo(o+160,0);c.lineTo(o-500,H);c.lineTo(o-660,H);c.fill()}c.restore();
 c.fillStyle="#000";c.beginPath();c.moveTo(0,1000);c.lineTo(W,880);c.lineTo(W,H);c.lineTo(0,H);c.fill();
 c.textAlign="center";c.fillStyle="#fff";
 const ip=ez(p/.12);c.save();c.translate(-W*(1-ip),0);c.fillStyle="#e60012";c.beginPath();c.moveTo(40,60);c.lineTo(W-20,30);c.lineTo(W-60,190);c.lineTo(0,220);c.fill();c.fillStyle="#fff";c.font="110px Impact,Arial Black,sans-serif";c.fillText("PHANTOM RATING",W/2,170);c.restore();
 const cp=ez((p-.12)/.14),S=640;c.save();c.translate(W/2,520);c.rotate((1-cp)*-.5);c.scale(cp,cp);c.fillStyle="#fff";c.fillRect(-S/2-12,-S/2-12,S+24,S+24);
 if(d.img&&d.ok)c.drawImage(d.img,-S/2,-S/2,S,S);else{c.fillStyle="#e60012";c.fillRect(-S/2,-S/2,S,S);c.fillStyle="#000";c.font="300px Impact,sans-serif";c.fillText("♪",0,100)}c.restore();
 const tp=ez((p-.26)/.1);c.globalAlpha=tp;c.fillStyle="#fff";c.font="64px Impact,Arial Black,sans-serif";wrap(c,d.title.toUpperCase(),W/2,960+(1-tp)*40,960,70,2);c.fillStyle="#bbb";c.font="42px Trebuchet MS,sans-serif";c.fillText(d.artist,W/2,1130);c.globalAlpha=1;
 const sp=ez((p-.4)/.2);if(sp>0){const v=d.rated?d.score*sp:0;c.save();c.translate(W/2,1380);c.scale(.6+.4*sp,.6+.4*sp);c.fillStyle=col;c.shadowColor=col;c.shadowBlur=d.score>=8?50*sp:0;c.font="330px Impact,Arial Black,sans-serif";c.fillStyle="#000";c.fillText(d.rated?fmt(v):"—",10,10);c.fillStyle=col;c.fillText(d.rated?fmt(v):"—",0,0);c.restore();
  if(p>.58){const k=ez((p-.58)/.06);c.fillStyle=col;c.save();c.translate(W/2,1470);c.skewX(-.2);c.scale(k,1);c.fillRect(-300,-54,600,80);c.fillStyle="#000";c.font="50px Impact,sans-serif";c.fillText(d.rated?cat(d.score)[0].toUpperCase():"SIN PUNTUAR",0,0);c.restore()}}
 if(p>.64){const k=ez((p-.64)/.1);c.globalAlpha=k;let y=1560;c.font="40px Trebuchet MS,sans-serif";d.extra.forEach(e=>{c.fillStyle=cat(e[1])[1];c.fillText(`${e[0].slice(0,28)} — ${fmt(e[1])}`,W/2,y);y+=52});
  if(op){const rev=op.slice(0,Math.ceil(op.length*cl((p-.68)/.2)));c.fillStyle="#fff";c.font="italic 40px Trebuchet MS,sans-serif";wrap(c,"«"+rev+(rev.length<op.length?"":"»"),W/2,y+20,900,50,d.extra.length?3:5)}c.globalAlpha=1}
 if(p>.93){const k=ez((p-.93)/.05);c.fillStyle="#e60012";c.fillRect(0,H-110*k,W,110*k);c.fillStyle="#fff";c.font="56px Impact,sans-serif";c.fillText((D.settings.name||"PHANTOM RATING").toUpperCase(),W/2,H-35)}}
let raf=0;
function opts(){return{T:+($("#v-dur")?.value||18),tpl:+($("#v-tpl")?.value||0),op:$("#v-op")?.value.trim()||"",}}
function drawPreview(at){cancelAnimationFrame(raf);const cv=$("#cv");if(!cv)return;const c=cv.getContext("2d"),o=opts(),d=V.vd;
 if(at!=null){setTimeout(()=>frame(c,d,at*o.T,o.T,o.tpl,o.op),300);return}
 const s=performance.now();const loop=()=>{const t=(performance.now()-s)/1000;frame(c,d,Math.min(t,o.T),o.T,o.tpl,o.op);if(t<o.T&&$("#cv"))raf=requestAnimationFrame(loop)};loop()}
function record(){const st=$("#vst");cancelAnimationFrame(raf);const cv=$("#cv");
 if(!cv.captureStream||!window.MediaRecorder){st.innerHTML='<div class="msg err">Tu navegador no permite grabar vídeo. Prueba con Chrome, Edge, Firefox o Safari actualizados.</div>';return}
 const types=["video/mp4;codecs=avc1","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];const mt=types.find(t=>MediaRecorder.isTypeSupported(t));
 if(!mt){st.innerHTML='<div class="msg err">Tu navegador no admite ningún formato de vídeo grabable.</div>';return}
 const o=opts(),d=V.vd,c=cv.getContext("2d");let rec,chunks=[];
 try{rec=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:6e6})}catch(x){st.innerHTML='<div class="msg err">No se pudo iniciar la grabación en este dispositivo.</div>';return}
 rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
 rec.onstop=()=>{const ext=mt.includes("mp4")?"mp4":"webm";const b=new Blob(chunks,{type:mt.split(";")[0]});const u=URL.createObjectURL(b);
  st.innerHTML=`<div class="msg ok">Vídeo listo (${ext.toUpperCase()}, 1080×1920).${d.imgFail?" La portada no se pudo incrustar por restricciones de Spotify; se usó un marcador.":""}</div><a class="btn" style="display:inline-block;text-decoration:none" href="${u}" download="phantom_rating.${ext}">Descargar vídeo</a>`};
 rec.start();const s=performance.now();st.innerHTML='<div class="msg inf">Grabando… no cierres esta pantalla.</div>';
 const loop=()=>{const t=(performance.now()-s)/1000;frame(c,d,Math.min(t,o.T),o.T,o.tpl,o.op);if(t<o.T)requestAnimationFrame(loop);else rec.stop()};loop()}
/* ============ 7. INICIO ============ */
go("home");
